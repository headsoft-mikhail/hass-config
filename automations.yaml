# air-conditioners
- id: '0034'  # air conditioner sync
  alias: haier_yaha_sync
  mode: parallel
  max: 5
  triggers:
    # 1 минута после восстановления
    - trigger: state
      entity_id: 
        - switch.air_conditioner_system_relay
        - binary_sensor.electricity_outage_sensor
        - binary_sensor.ping_8_8_8_8
      from: "off"
      to: "on"
      for: "00:01:00"
      id: recover
    # после запуска HA
    - trigger: homeassistant
      event: start
      id: ha_start
    # Кондиционер стал unavailable
    - trigger: state
      entity_id:
        - climate.gostinaia_haier_black
        - climate.spalnia_haier_white
        - climate.detskaia_haier_white
      to: unavailable
      id: ac_unavailable
    # Кондиционер непрерывно unavailable 5 минут
    - trigger: state
      entity_id:
        - climate.gostinaia_haier_black
        - climate.spalnia_haier_white
        - climate.detskaia_haier_white
      to: unavailable
      for: "00:05:00"
      id: ac_unavailable_5m
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: 
                - recover
            - condition: state
              entity_id: switch.air_conditioner_system_relay
              state: "on"
            - condition: state
              entity_id: binary_sensor.electricity_outage_sensor
              state: "on"
            - condition: state
              entity_id: binary_sensor.ping_8_8_8_8
              state: "on"
          sequence:
            - action: counter.increment
              target: 
                entity_id: counter.haier_yaha_refresh
            - action: homeassistant.update_entity
              target:
                entity_id:
                  - climate.gostinaia_haier_black
                  - climate.spalnia_haier_white
                  - climate.detskaia_haier_white
        - conditions: 
            - condition: trigger
              id: ha_start
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.haier_yaha_refresh
            - action: homeassistant.update_entity
              target:
                entity_id:
                  - climate.gostinaia_haier_black
                  - climate.spalnia_haier_white
                  - climate.detskaia_haier_white
            - delay: "00:01:00"
            - condition: state
              entity_id: switch.air_conditioner_system_relay
              state: "on"
            - condition: state
              entity_id: binary_sensor.electricity_outage_sensor
              state: "on"
            - condition: state
              entity_id: binary_sensor.ping_8_8_8_8
              state: "on"
            - repeat:
                for_each:
                  - climate.gostinaia_haier_black
                  - climate.spalnia_haier_white
                  - climate.detskaia_haier_white 
                sequence:
                  - condition: template
                    value_template: >
                      {{ states(repeat.item) == "unavailable" }}
                  - action: counter.increment
                    target:
                      entity_id: counter.haier_yaha_refresh
                  - action: homeassistant.update_entity
                    target:
                      entity_id: "{{ repeat.item }}"
        - conditions:
            - condition: trigger
              id: 
                - ac_unavailable
                - ac_unavailable_5m
            - condition: state
              entity_id: switch.air_conditioner_system_relay
              state: "on"
          sequence:
            - action: counter.increment
              target: 
                entity_id: counter.haier_yaha_refresh
            - action: homeassistant.update_entity
              target:
                entity_id: "{{ trigger.entity_id }}"
- id: '0025'  # oasis_set_target_temperature
  alias: oasis_set_target_temperature
  description: Установить целевую температуру приточной установки
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_number.oasis_target_temperature
  conditions:
  - condition: template
    value_template: >
        {% set val_x_2 = states('input_number.oasis_target_temperature') | float(0) * 2 %}
        {{ val_x_2 | round(0) | int == val_x_2}}
  - condition: template
    value_template: >
        {% set val = states('input_number.oasis_target_temperature') | float(0) %}
        {{ val >= 5 and val <= 30 }}
  - condition: template
    value_template: >
        {% set input_val_x_10 = (states('input_number.oasis_target_temperature') | float(0) * 10) | round(0) %}
        {% set sensor_val_x_10 = (states('sensor.oasis_target_temperature') | float(0)  * 10) | round(0) %}
        {{ input_val_x_10 != sensor_val_x_10 }}
  - condition: numeric_state
    entity_id: input_number.oasis_write_register_counter
    below: 20
  actions:
  - delay:
      seconds: 2
  - action: modbus.write_register
    data:
      hub: oasis
      unit: 1
      address: 31
      value: '{{ (states("input_number.oasis_target_temperature") | float * 10) | round(0) | int }}'
  - action: input_number.increment
    target:
      entity_id: input_number.oasis_write_register_counter
- id: '0026'  # oasis_sync_temperature_from_sensor_to_input_number
  alias: oasis_sync_temperature_from_sensor_to_input_number

- id: '0035'  # living_room_air_conditioner_backlight
  alias: living_room_air_conditioner_backlight
  description: Turn off living room air conditioner backlight if watching cinema
  triggers:
    - trigger: state
      entity_id:
        - climate.gostinaia_haier_black
        - binary_sensor.ping_xgimi
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: climate.gostinaia_haier_black
          state:
            - 'off'
            - 'unavailable'
            - 'unknown'
  actions:
    - delay: '00:00:15'
    - condition: not
      conditions:
        - condition: state
          entity_id: climate.gostinaia_haier_black
          state:
            - 'off'
            - 'unavailable'
            - 'unknown'
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.ping_xgimi
              state: 'on'
            - condition: state
              entity_id: switch.gostinaia_haier_black_podsvetka
              state: 'on'
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.gostinaia_haier_black_podsvetka
        - conditions:
            - condition: state
              entity_id: binary_sensor.ping_xgimi
              state: 'off'
            - condition: state
              entity_id: switch.gostinaia_haier_black_podsvetka
              state: 'off'
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.gostinaia_haier_black_podsvetka
  mode: restart

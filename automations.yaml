- id: '0024'  # notify_about_door_not_locked
  alias: notify_about_door_not_locked
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.hall_contact_sensor
        - lock.aqara_smart_lock_u200
  conditions:
    - condition: state
      entity_id: binary_sensor.hall_contact_sensor
      state: "on"
    - condition: state
      entity_id: lock.aqara_smart_lock_u200
      state: "unlocked"
  actions:
    - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.hall_contact_sensor
          to: "off" 
        - trigger: state
          entity_id: lock.aqara_smart_lock_u200
          to: "locked"
      timeout: "00:02:00"
      continue_on_timeout: true
    - condition: template
      value_template: "{{ wait.completed == false }}"
    - repeat:
        while:
          - condition: state
            entity_id: binary_sensor.hall_contact_sensor
            state: "on"
          - condition: state
            entity_id: lock.aqara_smart_lock_u200
            state: "unlocked"
        sequence:
          - action: notify.notify
            data:
              title: "Внимание!"
              message: "Дверь не заперта"
          - delay: "00:05:00"

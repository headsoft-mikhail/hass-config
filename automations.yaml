- id: '0011'  # power_sensors_heartbeat_15s
  alias: power_sensors_heartbeat_15s
  triggers:
    - trigger: time_pattern
      seconds: "/15"
  variables:
    sensors:
      - sensor.ventilation_system_relay_power
      - sensor.ventilation_system_relay_current
      - sensor.zemismart_smp01_power
      - sensor.zemismart_smp01_current
  actions:
    - repeat:
        for_each: "{{ sensors }}"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ (now() - states[repeat.item].last_changed).total_seconds() > 15 }}
            then:
              - action: homeassistant.update_entity
                target:
                  entity_id: "{{ repeat.item }}_sampled"
- id: '0012'  # petkit_cat_feeder_reboot
  alias: petkit_cat_feeder_reboot
  description: Reboot cat feeder if state is offline
  triggers:
    - trigger: state
      entity_id: 
        - sensor.fresh_element_solo_1_status
        - sensor.fresh_element_solo_2_status
      to: "offline"
  actions:
    - variables:
        feeder_switch: >
          {% if trigger.entity_id == 'sensor.fresh_element_solo_1_status' %}
            switch.cat_feeder_1
          {% else %}
            switch.cat_feeder_2
          {% endif %}
    - action: switch.turn_off
      target:
        entity_id: "{{ feeder_switch }}"
    - delay:
        seconds: 5
    - action: switch.turn_on
      target:
        entity_id: "{{ feeder_switch }}"
  mode: parallel
  max: 2
- id: '0013'  # select_kitchen_water_valve_state
  alias: select_kitchen_water_valve_state
  mode: queued
  triggers:
  - trigger: state
    entity_id: switch.kitchen_water_valve_open
  - trigger: state
    entity_id: switch.kitchen_water_valve_close
  variables:
    o: '{{ is_state("switch.kitchen_water_valve_open", "on") }}'
    c: '{{ is_state("switch.kitchen_water_valve_close", "on") }}'
    prev: '{{ states("input_select.kitchen_water_valve_state") }}'
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ o and c }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.kitchen_water_valve_state
        data:
          option: error
    - conditions:
      - condition: template
        value_template: '{{ o and not c }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.kitchen_water_valve_state
        data:
          option: opening
    - conditions:
      - condition: template
        value_template: '{{ c and not o }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.kitchen_water_valve_state
        data:
          option: closing
    - conditions:
      - condition: template
        value_template: '{{ not o and not c }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.kitchen_water_valve_state
        data:
          option: "{% if prev in ['opening', 'open'] %}open{% elif prev in ['closing', 'closed'] %}closed{% else %}{{ prev }}{% endif %}"
